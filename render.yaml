databases:
  - name: agry-key-db
    databaseName: agrykey
    user: agrykey_user
    plan: free
    region: singapore

services:
  - type: web
    name: agry-key-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health/liveness
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: "staging"
      - key: PROJECT_NAME
        value: "Agry-Key Backend"
      - key: API_V1_STR
        value: "/api/v1"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: agry-key-db
          property: connectionString
      - key: OTP_PROVIDER
        value: "twilio"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: DL_FORECAST_SERVICE_URL
        value: "https://agry-key-dl-space.hf.space/api/predict"
      - key: DL_FORECAST_SERVICE_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: "huggingface"
      - key: HF_INFERENCE_ENDPOINT_URL
        value: "https://router.huggingface.co/v1"
      - key: HF_MODEL_ID
        value: "Qwen/Qwen2.5-72B-Instruct"
      - key: HUGGINGFACE_API_KEY
        sync: false
