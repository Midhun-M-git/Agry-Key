services:
  - type: web
    name: agry-key-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: "Agry-Key Backend"
      - key: API_V1_STR
        value: "/api/v1"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite:///./agry_key.db" # Set to PostgreSQL connection string in production (e.g. postgresql://...)
      - key: SMS_PROVIDER
        value: "mock" # Set to "twilio" or "msg91" with SMS_API_KEY / TWILIO credentials for real SMS delivery
      - key: SMS_API_KEY
        value: "mock"
      - key: DL_FORECAST_SERVICE_URL
        value: "https://agry-key-dl-space.hf.space/api/predict"
