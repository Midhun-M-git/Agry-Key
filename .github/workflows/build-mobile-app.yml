name: Build & Release Mobile App (Android APK)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [ main ]
    paths:
      - "Frontend/**"
      - ".github/workflows/build-mobile-app.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend API Base URL (injected at build time)"
        required: false
        default: "https://agry-key.onrender.com"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: Frontend
        run: flutter analyze --no-fatal-infos

      - name: Build Android Release APK
        working-directory: Frontend
        env:
          BACKEND_URL: ${{ inputs.backend_url || vars.BACKEND_URL || 'https://agry-key.onrender.com' }}
        run: |
          echo "Building APK pointing to backend: $BACKEND_URL with version v1.0.${{ github.run_number }}"
          flutter build apk --release --android-skip-build-dependency-validation --build-name="1.0.${{ github.run_number }}" --build-number="${{ github.run_number }}" --dart-define=BACKEND_URL="$BACKEND_URL" --dart-define=APP_VERSION="v1.0.${{ github.run_number }}"

      - name: Verify APK Generated
        run: |
          ls -lh Frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare Named Release Assets
        run: |
          mkdir -p release-assets
          cp Frontend/build/app/outputs/flutter-apk/app-release.apk release-assets/agrikey-v1.0.${{ github.run_number }}.apk
          cp Frontend/build/app/outputs/flutter-apk/app-release.apk release-assets/agrikey-latest.apk
          cp Frontend/build/app/outputs/flutter-apk/app-release.apk release-assets/app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriKey-Android-Release-APK
          path: release-assets/
          retention-days: 30

      - name: Automatically Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-assets/*.apk
          name: AgriKey Release v1.0.${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🌾 AgriKey Android Mobile App

            An updated APK was automatically compiled and published by GitHub Actions from commit `${{ github.sha }}`.

            ### 📲 Direct APK Downloads:
            - **[agrikey-latest.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/agrikey-latest.apk)** *(Recommended - Latest Build)*
            - **[agrikey-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/agrikey-v1.0.${{ github.run_number }}.apk)** *(Versioned Build)*
            - **[app-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-release.apk)** *(Standard Output)*

            ---
            - **Cloud Backend:** `${{ inputs.backend_url || vars.BACKEND_URL || 'https://agry-key.onrender.com' }}`
            - **Build Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Commit:** `${{ github.sha }}`
