name: Build & Release Mobile App (Android APK)

on:
  push:
    branches: [ main, version-2-trial ]
    tags:
      - 'v*'
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [ main, version-2-trial ]
    paths:
      - "Frontend/**"
      - ".github/workflows/build-mobile-app.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend API Base URL (injected at build time)"
        required: false
        default: "https://agry-key.onrender.com"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: Frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Widget & Unit Tests
        working-directory: Frontend
        run: flutter test

      - name: Decode Android Release Keystore
        working-directory: Frontend/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Error: Required secret ANDROID_KEYSTORE_BASE64 is missing."
            echo "Release build aborted. Debug signing fallback is strictly disabled."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > agrikey-release.jks
          echo "Successfully decoded release keystore from GitHub secrets."

      - name: Build and Inspect Play Flavor Release Artifact
        working-directory: Frontend
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Building explicit Play release variant..."
          flutter build apk --release --flavor play --android-skip-build-dependency-validation --dart-define=DISTRIBUTION=play

          PLAY_APK="build/app/outputs/flutter-apk/app-play-release.apk"
          if [ ! -s "$PLAY_APK" ]; then
            echo "ERROR: Expected Play release APK does not exist or is empty at: $PLAY_APK"
            exit 1
          fi
          echo "Play release APK successfully generated: $(ls -lh "$PLAY_APK")"

          # Locate and verify apkanalyzer from Android SDK
          if ! command -v apkanalyzer &> /dev/null; then
            if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
              export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            elif [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" ]; then
              export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
            else
              APK_ANALYZER_BIN=$(find /usr/local/lib/android/sdk -name apkanalyzer 2>/dev/null | head -n 1)
              if [ -n "$APK_ANALYZER_BIN" ] && [ -x "$APK_ANALYZER_BIN" ]; then
                export PATH="$(dirname "$APK_ANALYZER_BIN"):$PATH"
              fi
            fi
          fi

          if ! command -v apkanalyzer &> /dev/null; then
            echo "ERROR: Android SDK apkanalyzer tool is missing from the environment."
            exit 1
          fi

          echo "Inspecting Play release artifact using apkanalyzer..."
          APP_ID=$(apkanalyzer manifest application-id "$PLAY_APK")
          if [ $? -ne 0 ] || [ -z "$APP_ID" ]; then
            echo "ERROR: Failed to extract application ID using apkanalyzer."
            exit 1
          fi
          echo "Artifact Application ID: $APP_ID"

          PERMISSIONS=$(apkanalyzer manifest permissions "$PLAY_APK")
          if [ $? -ne 0 ]; then
            echo "ERROR: apkanalyzer manifest permissions command failed."
            exit 1
          fi
          echo "Artifact Permissions:"
          echo "$PERMISSIONS"

          if echo "$PERMISSIONS" | grep -F "android.permission.REQUEST_INSTALL_PACKAGES"; then
            echo "CRITICAL VIOLATION: android.permission.REQUEST_INSTALL_PACKAGES found in Play release APK!"
            exit 1
          fi
          echo "VERIFIED: android.permission.REQUEST_INSTALL_PACKAGES is strictly absent from Play release APK."

      - name: Build Android Release APK
        working-directory: Frontend
        env:
          BACKEND_URL: ${{ inputs.backend_url || vars.BACKEND_URL || 'https://agry-key.onrender.com' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Building APK pointing to backend: $BACKEND_URL with version v1.0.${{ github.run_number }} (Flavor: github)"
          flutter build apk --release --flavor github --android-skip-build-dependency-validation --build-name="1.0.${{ github.run_number }}" --build-number="${{ github.run_number }}" --dart-define=BACKEND_URL="$BACKEND_URL" --dart-define=APP_VERSION="v1.0.${{ github.run_number }}" --dart-define=DISTRIBUTION=github

      - name: Verify APK Generated
        run: |
          ls -lh Frontend/build/app/outputs/flutter-apk/app-github-release.apk

      - name: Prepare Named Release Assets
        run: |
          mkdir -p release-assets
          APK_PATH="Frontend/build/app/outputs/flutter-apk/app-github-release.apk"
          echo "Found compiled release APK at: $APK_PATH"
          cp "$APK_PATH" release-assets/agrikey-v1.0.${{ github.run_number }}.apk
          cp "$APK_PATH" release-assets/agrikey-latest.apk
          cp "$APK_PATH" release-assets/app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriKey-Android-Release-APK
          path: release-assets/
          retention-days: 30

      - name: Automatically Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/version-2-trial' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-assets/*.apk
          name: AgriKey Release v1.0.${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🌾 AgriKey Android Mobile App

            An updated APK was automatically compiled and published by GitHub Actions from commit `${{ github.sha }}`.

            ### 📲 Direct APK Downloads:
            - **[agrikey-latest.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/agrikey-latest.apk)** *(Recommended - Latest Build)*
            - **[agrikey-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/agrikey-v1.0.${{ github.run_number }}.apk)** *(Versioned Build)*
            - **[app-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-release.apk)** *(Standard Output)*

            ---
            - **Cloud Backend:** `${{ inputs.backend_url || vars.BACKEND_URL || 'https://agry-key.onrender.com' }}`
            - **Build Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Commit:** `${{ github.sha }}`
