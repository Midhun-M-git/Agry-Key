name: Build & Release Mobile App (Android APK)

on:
  push:
    branches: [ main ]
    paths:
      - "Frontend/**"
      - ".github/workflows/build-mobile-app.yml"
    tags:
      - "v*"
  pull_request:
    branches: [ main ]
    paths:
      - "Frontend/**"
      - ".github/workflows/build-mobile-app.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend API Base URL (injected at build time)"
        required: false
        default: "https://agry-key.onrender.com"
        type: string
      create_release:
        description: "Publish a GitHub Release with the APK binary"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: Frontend
        env:
          BACKEND_URL: ${{ inputs.backend_url || vars.BACKEND_URL || 'https://agry-key.onrender.com' }}
        run: |
          echo "Building APK pointing to backend: $BACKEND_URL"
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=BACKEND_URL="$BACKEND_URL"

      - name: Verify APK Generated
        run: |
          ls -lh Frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriKey-Android-Release-APK
          path: Frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: Frontend/build/app/outputs/flutter-apk/app-release.apk
          name: AgriKey Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name || format('v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          body: |
            ## AgriKey Mobile App Release 🚀

            - **Backend URL:** `${{ inputs.backend_url || vars.BACKEND_URL || 'https://agry-key.onrender.com' }}`
            - **Commit:** `${{ github.sha }}`
            - **Artifact:** `app-release.apk`

            Download `app-release.apk` below and install it directly on your Android device.
