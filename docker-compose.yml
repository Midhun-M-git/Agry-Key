version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agry_key_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Agry-Key Backend
      - API_V1_STR=/api/v1
      - SECRET_KEY=replace-with-a-random-secret-at-least-32-characters-long
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=*
      - DATABASE_URL=sqlite:///./agry_key.db
      - SMS_PROVIDER=mock
      - DL_FORECAST_SERVICE_URL=http://dl_microservice:7860/api/predict
    volumes:
      - backend_data:/app
    depends_on:
      - dl_microservice

  dl_microservice:
    build:
      context: ./dl_microservice
      dockerfile: Dockerfile
    container_name: agry_key_dl_microservice
    restart: unless-stopped
    ports:
      - "7860:7860"

volumes:
  backend_data:
