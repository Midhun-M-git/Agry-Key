name: agrikey

description: "AI Powered Smart Agricultural Companion"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Location Services
  geolocator: ^11.1.0
  geocoding: ^3.0.0

  # Voice Assistant
  speech_to_text: ^7.0.0

  # Camera & Gallery
  image_picker: ^1.1.2

  # API Calls
  http: ^1.6.0

  # Local Storage
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/